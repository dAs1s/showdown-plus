name: Check styles and userscript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check headers, versions, braces and embedded pictures
        run: python tools/check_release.py --base "${{ github.event.before || github.event.pull_request.base.sha }}"
